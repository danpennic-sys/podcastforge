[package]
name = "podcastforge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Minimal offline 2-person podcast generator with seeded Maxx guest"

[[bin]]
name = "podcastforge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
rand = { version = "0.8", features = ["std_rng"] }
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
